name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test backend (unit tests only)
        run: mvn -B clean verify -DskipITs --file server/pom.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: client

      # Lint the OpenAPI spec BEFORE codegen — openapi-generator is lenient and turns malformed
      # specs into silently-wrong output, so a green codegen build is not proof of a valid contract.
      - name: Lint OpenAPI spec
        run: npm run lint:openapi
        working-directory: client

      - name: Generate API client
        run: npm run generate
        working-directory: client

      - name: Check generated code is up to date
        run: git diff --exit-code src/generated
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Format check
        run: npm run format:check
        working-directory: client

      - name: Run tests with coverage
        run: npm test -- --watch=false --coverage
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Playwright e2e tests
        run: npm run e2e
        working-directory: client

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Generate API client
        run: npm run generate
        working-directory: client

      - name: Run E2E tests
        run: mvn -B verify --file server/pom.xml
