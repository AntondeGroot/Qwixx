name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test backend (unit tests only)
        run: mvn -B clean verify -DskipITs --file server/pom.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install
        working-directory: client

      - name: Generate API client
        run: npm run generate
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Run tests
        run: npm test -- --watch=false
        working-directory: client

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Generate API client
        run: npm run generate
        working-directory: client

      - name: Run E2E tests
        run: mvn -B verify --file server/pom.xml
