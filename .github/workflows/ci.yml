name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # openapi-generator is lenient and turns malformed specs into silently-wrong output, so a green
  # codegen build in the other jobs is not proof of a valid contract; the ci gate needs this too.
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Lint OpenAPI spec
        run: npm run lint:openapi
        working-directory: client

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test backend (unit tests only)
        run: mvn -B clean verify -DskipITs --file server/pom.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Generate API client
        run: npm run generate
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Format check
        run: npm run format:check
        working-directory: client

      - name: Run tests with coverage
        run: npm test -- --watch=false --coverage
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Playwright e2e tests
        run: npm run e2e
        working-directory: client

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Generate API client
        run: npm run generate
        working-directory: client

      - name: Run E2E tests
        run: mvn -B verify --file server/pom.xml

  # PIT mutation testing fails if the mutation score drops below the ratcheted threshold in the
  # pom's `mutation` profile — catching weak tests that line coverage can't. It re-runs the suite
  # once per mutation, so it only runs on pull requests, not on every push to main.
  mutation:
    name: PIT mutation coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Run mutation coverage
        # test-compile (under the mutation profile → Java 22 bytecode for PIT's ASM) must run first;
        # invoked alone, pitest:mutationCoverage finds no compiled classes on a fresh checkout.
        run: mvn -Pmutation clean test-compile pitest:mutationCoverage --batch-mode --no-transfer-progress
        working-directory: server

  # The only check the branch ruleset requires, so jobs can be added or renamed without editing it.
  # `if: always()` matters: without it a failed dependency skips this job, and a skipped required
  # check counts as passing.
  ci:
    if: always()
    needs: [openapi-lint, backend, frontend, e2e, mutation]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
