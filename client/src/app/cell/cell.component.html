<div class="cell"
     [attr.role]="(clickable() || pending()) ? 'button' : null"
     [tabindex]="(clickable() || pending()) ? 0 : -1"
     [class.crossed]="crossed()"
     [class.pending]="pending()"
     [class.closing-eligible]="cell().closingEligible"
     [class.extra-bucket]="hasTag()(TagEnum.EXTRA_BUCKET)"
     [class.auto-cross]="hasTag()(TagEnum.AUTO_CROSS)"
     [class.big-points-cell]="!!secondaryColor()"
     [class.x-change-cell]="!!xChangeValues()"
     [class.primary-maxed]="primaryMaxed()"
     [class.secondary-maxed]="secondaryMaxed()"
     [class.clickable]="showClickable() ?? clickable()"
     [class.ww]="showDieHint()"
     [attr.data-color]="cell().color"
     [attr.data-secondary-color]="secondaryColor()"
     (click)="(clickable() || pending()) && clicked.emit()"
     (keydown.enter)="(clickable() || pending()) && clicked.emit()"
     [attr.translate]="'no'">
  @if (secondaryColor()) {
    <!-- SVG fills via inherited CSS custom properties --primary-color / --secondary-color. -->
    <svg class="big-points-svg" viewBox="0 0 44 32" xmlns="http://www.w3.org/2000/svg">
      <path style="fill: var(--primary-color)"
            d="M35.9,8 C29,7,25,10,22,16 C19,22,15,25,8.1,24 A16,16,0,0,1,35.9,8 Z"/>
      <path style="fill: var(--secondary-color)"
            d="M8.1,24 C15,25,19,22,22,16 C25,10,29,7,35.9,8 A16,16,0,0,1,8.1,24 Z"/>
      <path d="M35.9,8 C29,7,25,10,22,16 C19,22,15,25,8.1,24"
            stroke="white" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </svg>
  } @else if (xChangeValues()) {
    <div class="xchange-inner">
      <span class="xchange-top">{{ xChangeValues()!.a }}</span>
      <svg class="xchange-arrows" viewBox="0 0 20 14" xmlns="http://www.w3.org/2000/svg">
        <path d="M3,2 Q3,7 8,7" stroke="#7B1FA2" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M6,5 L8,7 L6,9" stroke="#7B1FA2" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17,12 Q17,7 12,7" stroke="#7B1FA2" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M14,9 L12,7 L14,5" stroke="#7B1FA2" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="xchange-bot">{{ xChangeValues()!.b }}</span>
    </div>
  } @else {
    <span class="cell-value">{{ cell().displayValue }}</span>
  }
  @if (crossed() || pending()) {
    <span class="cell-cross">✕</span>
  }
</div>
