@if (measured().length > 0) {
  <svg class="connector-overlay" aria-hidden="true">
    <defs>
      <marker
        id="conn-arrow"
        markerWidth="14"
        markerHeight="12"
        refX="7"
        refY="6"
        orient="auto"
        markerUnits="userSpaceOnUse"
      >
        <path d="M0,0 L12,6 L0,12 L4,6 Z" fill="rgb(20, 20, 20)" />
      </marker>
    </defs>
    @for (link of measured(); track $index) {
      <line
        [attr.x1]="link.x1"
        [attr.y1]="link.y1"
        [attr.x2]="link.x2"
        [attr.y2]="link.y2"
        [class.one-way]="link.oneWay"
        [attr.marker-end]="link.oneWay ? 'url(#conn-arrow)' : null"
      />
    }
  </svg>
}
