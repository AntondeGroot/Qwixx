<div class="mini-sheet">
  @for (row of rows(); track row.id) {
    <div
      class="mini-row"
      [class.mini-row-xchange]="isXChangeRow(row)"
      [class.mini-row-lucky-number]="isLuckyRow(row)"
      [class.mini-row-bonus-bar]="row.bonusBar"
      [class.mini-row-bstrip]="row.bonusBStrip"
      [class.mini-row-mixed]="isMixedRow(row)"
      [class.mini-row-double]="hasTwins(row)"
      [class.row-closed]="isRowClosed(row.id)"
      [attr.data-color]="
        isXChangeRow(row) || isLuckyRow(row) || row.bonusBar || row.bonusBStrip || isMixedRow(row)
          ? null
          : row.cells[0]?.color
      "
      [style.--mini-primary]="colorHex[row.cells[0]?.color ?? '']"
      [style.--mini-secondary]="colorHex[secondaryColorOf(row.cells[0]) ?? '']"
    >
      @let columns = columnCells(row);
      @for (cell of columns; track cell.id; let idx = $index) {
        @if (cell.closingEligible && !columns[idx - 1]?.closingEligible) {
          <div class="mini-closing-divider"></div>
        }
        <div class="mini-column">
          <div
            class="mini-cell"
            [attr.data-color]="cell.color"
            [attr.data-bb-shape]="row.bonusBStrip ? bonusBShape(cell) : null"
            [class.mini-cell-big-points]="row.bonusRow"
            [class.mini-cell-xchange]="isXChange(cell)"
            [class.mini-cell-lucky-number]="isLuckyNumber(cell)"
            [class.mini-cell-lucky-cross]="isLuckyCross(cell)"
            [class.crossed]="isCrossed(row.id, cell.id)"
            [class.closing-eligible]="cell.closingEligible"
            [class.mini-cell-greyed-out]="isGreyedOutBarCell(row, cell)"
          ></div>
          @if (twinOf(cell); as twin) {
            <div
              class="mini-cell mini-cell-twin"
              [style.--mini-twin]="colorHex[twin.color]"
              [class.crossed]="isCrossed(row.id, twin.id)"
            ></div>
          }
        </div>
      }
      @if (row.lock) {
        <div class="mini-lock">
          <img src="lock_icon.svg" alt="" class="mini-lock-icon" [class.lock-crossed]="isLockCrossed(row.id)" />
        </div>
      }
    </div>
  }
</div>
