<div class="row" [class.closed]="closed()" [attr.data-color]="row().cells[0]?.color" translate="no">
  @for (cell of regularCells(); track cell.id) {
    <app-cell [cell]="cell" [crossed]="isCrossed(cell.id)"
              [pending]="pendingCellIds().has(cell.id)"
              [clickable]="clickableCellIds().has(cell.id)"
              [showClickable]="showClickableCellIds()?.has(cell.id)"
              (clicked)="cellClicked.emit(cell.id)" />
  }
  <div class="lock-zone" [class.lock-zone-crossed]="rowState()?.lockCrossed">
    @for (cell of closingEligibleCells(); track cell.id) {
      <app-cell [cell]="cell" [crossed]="isCrossed(cell.id)"
                [pending]="pendingCellIds().has(cell.id)"
                [clickable]="clickableCellIds().has(cell.id)"
                [showClickable]="showClickableCellIds()?.has(cell.id)"
                (clicked)="cellClicked.emit(cell.id)" />
    }
    <div class="lock-cell"
         [attr.data-color]="row().cells[0]?.color"
         [class.lock-crossed]="rowState()?.lockCrossed"
         [class.lock-closed]="closed()"
         [class.lock-clickable]="lockClickable() && !rowState()?.lockCrossed && !closed()"
         (click)="lockClickable() && !rowState()?.lockCrossed && !closed() && lockClicked.emit()">
      <img src="lock_icon.svg" alt="lock" class="lock-icon" />
    </div>
  </div>
</div>
