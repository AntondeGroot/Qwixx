<!doctype html>
<!--
  The repo's social preview (GitHub: Settings → General → Social preview), 1280×640.
  Rendered to docs/social-preview.png by OptionPreviewGeneratorIT, from the option previews in
  docs/option-previews/ — so run ./scripts/generate-option-docs.sh rather than editing the PNG.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
      }
      .preview {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        position: relative;
        background: radial-gradient(ellipse at 72% 50%, #3a3226 0%, #241f18 60%, #15120d 100%);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      /* The four row colours of the sheet, as a stripe along the top and bottom edge. */
      .stripe {
        position: absolute;
        inset: 0 0 auto 0;
        height: 12px;
        background: linear-gradient(
          90deg,
          #d32f2f 0 25%,
          #f9a825 25% 50%,
          #388e3c 50% 75%,
          #1565c0 75%
        );
      }
      .stripe.bottom {
        inset: auto 0 0 0;
      }
      .text {
        position: absolute;
        left: 80px;
        top: 112px;
        width: 440px;
      }
      h1 {
        margin: 0;
        font:
          112px/1 'Luckiest Guy',
          cursive;
        letter-spacing: 6px;
        color: #fff;
        text-shadow:
          4px 4px 0 #d32f2f,
          8px 8px 0 #1565c0,
          10px 10px 22px rgba(0, 0, 0, 0.6);
      }
      .pitch {
        margin: 34px 0 0;
        font-size: 28px;
        line-height: 1.35;
        color: #f4efe6;
      }
      .facts {
        margin: 28px 0 0;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .facts span {
        padding: 7px 16px;
        border-radius: 999px;
        font-size: 18px;
        font-weight: 700;
        color: #f4efe6;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.28);
      }
      .dice {
        margin: 34px 0 0;
        display: flex;
        gap: 14px;
      }
      .die {
        width: 50px;
        height: 50px;
        padding: 7px;
        box-sizing: border-box;
        border-radius: 10px;
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        --pip: #fff;
      }
      .die i {
        width: 9px;
        height: 9px;
        margin: auto;
        border-radius: 50%;
        background: var(--pip);
      }
      .die.white {
        background: #f7f5de;
        --pip: #241f18;
      }
      .die.red {
        background: #d32f2f;
      }
      .die.yellow {
        background: #f9a825;
      }
      .die.green {
        background: #388e3c;
      }
      .die.blue {
        background: #1565c0;
      }
      /* A pip's grid cell, numbered 1–9 left to right, top to bottom. */
      .p1 { grid-area: 1 / 1; }
      .p3 { grid-area: 1 / 3; }
      .p4 { grid-area: 2 / 1; }
      .p5 { grid-area: 2 / 2; }
      .p6 { grid-area: 2 / 3; }
      .p7 { grid-area: 3 / 1; }
      .p9 { grid-area: 3 / 3; }
      .sheets {
        position: absolute;
        left: 600px;
        top: 0;
        width: 680px;
        height: 640px;
      }
      .sheets img {
        position: absolute;
        width: 560px;
        border-radius: 12px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
      }
      .sheets .back {
        left: 110px;
        top: 52px;
        transform: rotate(5deg);
      }
      .sheets .front {
        left: 40px;
        top: 318px;
        transform: rotate(-4deg);
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <div class="stripe"></div>
      <div class="stripe bottom"></div>
      <div class="text">
        <h1>QWIXX</h1>
        <p class="pitch">The quick dice game, played online with friends.</p>
        <div class="facts">
          <span>1–5 players</span>
          <span id="sheet-count">15 sheet variants</span>
          <span>Phone &amp; desktop</span>
        </div>
        <div class="dice">
          <div class="die white"><i class="p5"></i></div>
          <div class="die white"><i class="p1"></i><i class="p5"></i><i class="p9"></i></div>
          <div class="die red"><i class="p1"></i><i class="p3"></i><i class="p7"></i><i class="p9"></i></div>
          <div class="die yellow"><i class="p1"></i><i class="p9"></i></div>
          <div class="die green"><i class="p1"></i><i class="p3"></i><i class="p4"></i><i class="p6"></i><i class="p7"></i><i class="p9"></i></div>
          <div class="die blue"><i class="p1"></i><i class="p3"></i><i class="p5"></i><i class="p7"></i><i class="p9"></i></div>
        </div>
      </div>
      <div class="sheets">
        <img class="back" src="option-previews/mixedColors.png" alt="" />
        <img class="front" src="option-previews/standard.png" alt="" />
      </div>
    </div>
  </body>
</html>
