spring.application.name=qwixx
server.port=4300
spring.jackson.default-property-inclusion=non_null
spring.config.import=optional:file:/opt/qwixx/application-override.yaml

# Rotation caps for the app's own log file, so a runaway logger can never fill the Pi's disk:
# 10MB per file, at most 7 archives, 100MB total. Old archives are also swept at startup, not only
# on rollover, so a restart after an incident reclaims the space immediately.
# These are inert until logging.file.name is set — the Pi sets it in application-override.yaml;
# in dev the app logs to the console only and writes no file.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.clean-history-on-start=true

