# The freeze baseline (archunit_store/) is committed, so store creation is disabled: a missing store
# now fails loudly instead of silently re-baselining and accepting whatever exists. To re-baseline
# deliberately (e.g. after editing code in the frozen-cycle packages), flip this to true for one run
# — after deleting archunit_store/ — then back to false.
freeze.store.default.allowStoreCreation=false
